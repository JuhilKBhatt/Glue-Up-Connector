<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Glue Up Tools{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }
        
        /* Sidebar Styles */
        #sidebar {
            min-width: 250px;
            max-width: 250px;
            background: #2c3e50;
            color: #fff;
            transition: all 0.3s;
            min-height: 100vh;
            position: fixed;
        }
        
        #sidebar .sidebar-header {
            padding: 20px;
            background: #1a252f;
            text-align: center;
        }
        
        #sidebar ul.components {
            padding: 20px 0;
        }
        
        #sidebar ul li a {
            padding: 15px 20px;
            font-size: 1.1em;
            display: block;
            color: #ecf0f1;
            text-decoration: none;
            transition: 0.2s;
        }
        
        #sidebar ul li a:hover {
            color: #3498db;
            background: #34495e;
        }
        
        #sidebar ul li.active > a {
            color: #fff;
            background: #3498db;
            border-left: 4px solid #2980b9;
        }
        
        #sidebar ul li a i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }

        /* Main Content Styles */
        #content {
            margin-left: 250px;
            padding: 30px;
            width: calc(100% - 250px);
            min-height: 100vh;
        }
        
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        
        .card-header {
            background-color: #fff;
            border-bottom: 1px solid #edf2f9;
            padding: 15px 20px;
            font-weight: bold;
            border-radius: 10px 10px 0 0 !important;
        }
        
        /* Table enhancements */
        .table-responsive {
            border-radius: 8px;
            overflow: hidden;
        }
        
        .table thead th {
            background-color: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            color: #495057;
        }
        
        /* Dropzone */
        .drop-zone {
            max-width: 100%;
            height: 200px;
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 500;
            font-size: 20px;
            cursor: pointer;
            color: #6c757d;
            border: 3px dashed #0d6efd;
            border-radius: 10px;
            background-color: #f8f9fa;
            transition: all 0.3s;
        }
        .drop-zone--over {
            border-style: solid;
            background-color: #e9ecef;
            transform: scale(1.02);
        }
        .drop-zone__input {
            display: none;
        }
        
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>

    <div class="d-flex">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-plug fs-1 mb-2 text-info"></i>
                <h4 class="mb-0">Glue Up Tools</h4>
            </div>

            <ul class="list-unstyled components">
                <li class="{% if request.path == '/' %}active{% endif %}">
                    <a href="/"><i class="fa-solid fa-broom"></i> CRM Cleanup</a>
                </li>
                <li class="{% if request.path == '/dedupe' %}active{% endif %}">
                    <a href="/dedupe"><i class="fa-solid fa-users-viewfinder"></i> Duplicate Predictor</a>
                </li>
                <!-- Future Modules can go here -->
                <li class="mt-4 px-3">
                    <small class="text-muted text-uppercase fw-bold">Coming Soon</small>
                </li>
                <li>
                    <a href="#" class="text-secondary"><i class="fa-solid fa-plus"></i> New Module</a>
                </li>
            </ul>
        </nav>

        <!-- Page Content -->
        <div id="content">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
