<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Glue Up Tools{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        
        /* Sidebar Styles */
        #sidebar {
            min-width: 280px;
            max-width: 280px;
            background: #1e1e2f;
            color: #fff;
            transition: all 0.3s;
            min-height: 100vh;
            position: fixed;
            box-shadow: 4px 0 15px rgba(0,0,0,0.05);
            z-index: 1000;
        }
        
        #sidebar .sidebar-header {
            padding: 30px 20px;
            background: #151522;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        #sidebar ul.components {
            padding: 20px 15px;
        }
        
        #sidebar ul li {
            margin-bottom: 5px;
        }
        
        #sidebar ul li a {
            padding: 12px 20px;
            font-size: 1.05em;
            display: flex;
            align-items: center;
            color: #a0a0b5;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s;
            font-weight: 500;
        }
        
        #sidebar ul li a:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
            transform: translateX(3px);
        }
        
        #sidebar ul li.active > a {
            color: #fff;
            background: #0d6efd;
            box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
        }
        
        #sidebar ul li a i {
            margin-right: 12px;
            width: 20px;
            text-align: center;
            font-size: 1.1em;
        }

        /* Main Content Styles */
        #content {
            margin-left: 280px;
            padding: 40px;
            width: calc(100% - 280px);
            min-height: 100vh;
        }
        
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>

    <div class="d-flex">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary rounded-circle mb-3 shadow" style="width: 60px; height: 60px;">
                    <i class="fa-solid fa-bolt text-white fs-3"></i>
                </div>
                <h5 class="mb-0 fw-bold text-white tracking-wide">GLUE UP CONNECTOR</h5>
            </div>

            <ul class="list-unstyled components">
                <li class="px-3 mb-2 text-uppercase fw-bold" style="font-size: 0.75rem; color: #5c5c77; letter-spacing: 1px;">Data Management</li>
                <li class="{% if request.path == '/' %}active{% endif %}">
                    <a href="/"><i class="fa-solid fa-broom"></i> CRM Cleanup</a>
                </li>
                <li class="{% if request.path == '/dedupe' %}active{% endif %}">
                    <a href="/dedupe"><i class="fa-solid fa-users-viewfinder"></i> Duplicate Predictor</a>
                </li>
                <li class="{% if request.path == '/archiving' %}active{% endif %}">
                    <a href="/archiving"><i class="fa-solid fa-box-archive"></i> Archiving</a>
                </li>
                
                <li class="px-3 mt-4 mb-2 text-uppercase fw-bold" style="font-size: 0.75rem; color: #5c5c77; letter-spacing: 1px;">Finance & Sync</li>
                <li class="{% if request.path == '/invoices' %}active{% endif %}">
                    <a href="/invoices"><i class="fa-solid fa-file-invoice-dollar"></i> Xero Invoices</a>
                </li>
            </ul>
        </nav>

        <!-- Page Content -->
        <div id="content">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
