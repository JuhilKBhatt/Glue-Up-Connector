services:
  - type: web
    name: glue-up-tools
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    envVars:
      - key: GLUEUP_API_BASE_URL
        value: https://api-services.glueup.com/v2
      - key: GLUEUP_PUBLIC_KEY
        sync: false
      - key: GLUEUP_PRIVATE_KEY
        sync: false
